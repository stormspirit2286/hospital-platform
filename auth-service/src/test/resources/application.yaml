spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/hospital_auth
    username: hospital
    password: hospital123
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

eureka:
  client:
    enabled: false

auth:
  jwt:
    issuer: hospital-auth-service-test
    secret: "local-test-secret-change-me-local-test-secret-change-me"
    access-token-ttl-minutes: 15
  refresh-token:
    ttl-days: 30
